source_file: RCA_Rules.xlsx
gate_rule:
  id: 1
  condition: S01_Weeks_Cover <= 1.1 * S01_Weeks_Cover_Target
  result: No Action Required
  note: If S01_Weeks_Cover > S01_Weeks_Cover_Target, then go ahead with finding root cause
rules:
- id: 2
  condition: S02_Zero_Sales_Flag == 1
  root_cause: Possible Phantom Inventory
- id: 3
  condition: S03_Active_Promo_Flag == 1
  root_cause: Active Promo
- id: 4
  condition: S04_Days_To_Promo_Start <= 14 AND S04_Upcoming_Promo_Flag == 1
  root_cause: Upcoming Promo
- id: 5
  condition: S06_Days_Since_Promo_Ended > 7 AND S07_Post_Promo_Velocity_Ratio < 0.5
  root_cause: Post-promo demand collapse
  note: In this case, no need to mention 'Demand Decline' due to low sales velocity ratio
- id: 6
  condition: S09_Days_To_Season_End <= S01_Weeks_Cover * 7
  root_cause: Season-end write-off risk
  note: 'Corrected: compares Days to Season End against Weeks Cover converted to days (x7).'
- id: 7
  condition: S10_Sales_Velocity_Ratio < 0.75
  root_cause: Demand Decline
  note: Suppressed if Rule 5 (Post-promo demand collapse) already fired for this row.
- id: 8
  condition: S15_Forecast_vs_Actual_Pct > 15
  root_cause: high forecast bias
- id: 9
  condition: S17_Excess_Supply_Ratio > 2
  root_cause: Excess Supply
- id: 10
  condition: S18_Promo_Excess_Supply_Ratio > 3 AND S06_Days_Since_Promo_Ended > 0
  root_cause: Promo Overbuy
- id: 11
  condition: S12_Peer_DIO_Rate > 1.5
  root_cause: high stock vs peers
- id: 12
  condition: S13_Format_DIO_Ratio > 1.5
  root_cause: High Stock vs Format
- id: 13
  condition: S16_Par_Level_Age_Days > 90 AND S10_Sales_Velocity_Ratio < 0.75
  root_cause: Stale Par Level
  note: Stale Par Level only triggers with low sales velocity ratio
- id: 14
  condition: S22_Shelf_Life_Remaining_Days <= 0
  root_cause: Stock Expired
  note: First check Rule 14, then Rule 15, then Rule 16, in that order. If Rule 14 true, skip 15 & 16.
    If Rule 15 true, skip 16.
- id: 15
  condition: S22_Shelf_Life_Remaining_Days < S01_Weeks_Cover * 7
  root_cause: 'Expiry Risk: Short-Expiry SKU ordered more than actual demand'
  note: 'Corrected: uses Weeks Cover x7. Continue evaluating other signals for more root causes after
    this fires.'
- id: 16
  condition: S22_Shelf_Life_Remaining_Days < 7
  root_cause: 'Near Expiry: Monitor'
  note: Continue evaluating other signals for more root causes after this fires.
- id: 17
  condition: S19_High_SS_Flag_Days > 2
  root_cause: High Safety Stock
- id: 18
  condition: S20_Supplier_MOQ_Ratio > 1.3
  root_cause: Supplier MoQ Overbuy
- id: 19
  condition: S01_Weeks_Cover > 1.1 * S01_Weeks_Cover_Target AND no_other_rule_fired
  root_cause: Monitor - Review at next weekly cycle
  note: Fallback default state, added per Gap 10 correction.
perishable_rule_sequencing: Rules 14, 15, 16 are evaluated in that strict order and are mutually exclusive
  (first true rule wins among the three); all other rules (2-13, 17-19) are independent and may co-fire.
expiry_rules_bypass_gate: true
active_promo_suppression:
  source: Signal_KPI_Parameters.xlsx Context_Parameters CTX001
  rule: When Rule 3 (Active Promo) fires, all excess-type root causes (Rules 8-12, 17, 18) are suppressed
    UNLESS S01_Weeks_Cover > 3 * S01_Weeks_Cover_Target, in which case they are NOT suppressed. Confirmed
    via Row 4 in the validated sample data.
  suppressed_rule_ids:
  - 8
  - 9
  - 10
  - 11
  - 12
  - 17
  - 18
