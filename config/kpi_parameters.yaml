source_file: Signal_KPI_Parameters.xlsx
KPI_Parameters:
- KPI_ID: KPI001
  Signal_Name: Weeks Cover
  RCA_Bucket: All Buckets — Gate Signal
  Parameter_ID: P001
  Parameter_Name: Target multiplier
  Parameter_Type: Multiplier
  Operator: '>'
  Value: 1.1
  Value_2: null
  Unit: x Target
  Applies_To: SKU-Store
  Severity: null
  Active: 'Yes'
  Notes: 'Gate signal: other excess signals only fire when this condition is met.'
- KPI_ID: KPI002
  Signal_Name: Zero Sales Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P002
  Parameter_Name: Zero-sales days (Non-perishable)
  Parameter_Type: Threshold
  Operator: '='
  Value: 5
  Value_2: null
  Unit: Days
  Applies_To: Non-perishable
  Severity: null
  Active: 'Yes'
  Notes: Flag when System Stock > 0 and Daily Sales = 0 for N days.
- KPI_ID: KPI002
  Signal_Name: Zero Sales Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P003
  Parameter_Name: Zero-sales days (Perishable)
  Parameter_Type: Threshold
  Operator: '='
  Value: 2
  Value_2: null
  Unit: Days
  Applies_To: Perishable
  Severity: null
  Active: 'Yes'
  Notes: Perishable-specific N.
- KPI_ID: KPI003
  Signal_Name: Active Promo Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P004
  Parameter_Name: Promo suppression multiplier
  Parameter_Type: Multiplier
  Operator: '>'
  Value: 3
  Value_2: null
  Unit: x Target
  Applies_To: All
  Severity: Override
  Active: 'Yes'
  Notes: Active promo suppresses excess signals unless Weeks Cover > 3x target.
- KPI_ID: KPI004
  Signal_Name: Upcoming Promo Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P005
  Parameter_Name: Days to promo start
  Parameter_Type: Threshold
  Operator: <=
  Value: 14
  Value_2: null
  Unit: Days
  Applies_To: All
  Severity: Override
  Active: 'Yes'
  Notes: Suppress when promo starts within 14 days and promo stock is ordered.
- KPI_ID: KPI005
  Signal_Name: Promo Stock Ordered Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P006
  Parameter_Name: Promo order indicator
  Parameter_Type: Flag
  Operator: '='
  Value: 1
  Value_2: null
  Unit: Flag
  Applies_To: All
  Severity: Override
  Active: 'Yes'
  Notes: Promo stock ordered / promo order type present.
- KPI_ID: KPI006
  Signal_Name: Days Since Promo Ended
  RCA_Bucket: Demand Signal Problem
  Parameter_ID: P007
  Parameter_Name: Days since promo ended
  Parameter_Type: Threshold
  Operator: '>'
  Value: 7
  Value_2: null
  Unit: Days
  Applies_To: Club S7
  Severity: High
  Active: 'Yes'
  Notes: Promo ended >7 days and velocity has not recovered.
- KPI_ID: KPI007
  Signal_Name: Post-Promo Sales Velocity Ratio
  RCA_Bucket: Demand Signal Problem
  Parameter_ID: P008
  Parameter_Name: Post/pre promo velocity ratio
  Parameter_Type: Threshold
  Operator: <
  Value: 0.5
  Value_2: null
  Unit: Ratio
  Applies_To: Club S6
  Severity: High
  Active: 'Yes'
  Notes: Only evaluated with S6.
- KPI_ID: KPI008
  Signal_Name: Active Season Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P009
  Parameter_Name: Active season indicator
  Parameter_Type: Flag
  Operator: '='
  Value: 1
  Value_2: null
  Unit: Flag
  Applies_To: Seasonal
  Severity: Override
  Active: 'Yes'
  Notes: Suppress excess signals unless Weeks Cover > 3x target.
- KPI_ID: KPI008
  Signal_Name: Active Season Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P010
  Parameter_Name: Season suppression multiplier
  Parameter_Type: Multiplier
  Operator: '>'
  Value: 3
  Value_2: null
  Unit: x Target
  Applies_To: Seasonal
  Severity: Override
  Active: 'Yes'
  Notes: Active season suppresses excess signals unless Weeks Cover > 3x target.
- KPI_ID: KPI009
  Signal_Name: Days to Season End
  RCA_Bucket: Demand Signal Problem
  Parameter_ID: P011
  Parameter_Name: Season-end days vs Days of Cover
  Parameter_Type: Dynamic comparison
  Operator: <
  Value: Days of Cover
  Value_2: null
  Unit: Days
  Applies_To: Seasonal
  Severity: High
  Active: 'Yes'
  Notes: Flag when stock will not clear before season ends.
- KPI_ID: KPI010
  Signal_Name: Sales Velocity Ratio
  RCA_Bucket: Demand Signal Problem
  Parameter_ID: P012
  Parameter_Name: Sales velocity ratio
  Parameter_Type: Threshold
  Operator: <
  Value: 0.75
  Value_2: null
  Unit: Ratio
  Applies_To: All
  Severity: High
  Active: 'Yes'
  Notes: 7-day average daily sales / 28-day average daily sales.
- KPI_ID: KPI011
  Signal_Name: Peer Active Promo Flag
  RCA_Bucket: Context / Override
  Parameter_ID: P013
  Parameter_Name: Peer promo exclusion flag
  Parameter_Type: Flag
  Operator: '='
  Value: 1
  Value_2: null
  Unit: Flag
  Applies_To: Peer comparison
  Severity: Override
  Active: 'Yes'
  Notes: Exclude peer comparison when peer store is in active promo.
- KPI_ID: KPI012
  Signal_Name: Peer DIO Rate
  RCA_Bucket: Network Problem
  Parameter_ID: P014
  Parameter_Name: Peer DIO multiplier
  Parameter_Type: Multiplier
  Operator: '>'
  Value: 1.5
  Value_2: null
  Unit: x Peer Average
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: This store DIO is >50% worse than peer stores.
- KPI_ID: KPI013
  Signal_Name: Format DIO Ratio
  RCA_Bucket: Network Problem
  Parameter_ID: P015
  Parameter_Name: Format DIO multiplier
  Parameter_Type: Multiplier
  Operator: '>'
  Value: 1.5
  Value_2: null
  Unit: x Format Target
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: DIO is >50% above target for store format.
- KPI_ID: KPI014
  Signal_Name: Peer Shortage Flag
  RCA_Bucket: Network Problem
  Parameter_ID: P016
  Parameter_Name: Peer shortage flag
  Parameter_Type: Flag
  Operator: '='
  Value: 1
  Value_2: null
  Unit: Flag
  Applies_To: Peer comparison
  Severity: High
  Active: 'Yes'
  Notes: Same SKU weeks cover <1.5 at a store within 20 miles; peer promo excluded.
- KPI_ID: KPI014
  Signal_Name: Peer Shortage Flag
  RCA_Bucket: Network Problem
  Parameter_ID: P017
  Parameter_Name: Peer weeks-cover threshold
  Parameter_Type: Threshold
  Operator: <
  Value: 1.5
  Value_2: null
  Unit: Weeks
  Applies_To: Peer store
  Severity: High
  Active: 'Yes'
  Notes: Used to determine peer shortage.
- KPI_ID: KPI014
  Signal_Name: Peer Shortage Flag
  RCA_Bucket: Network Problem
  Parameter_ID: P018
  Parameter_Name: Peer search radius
  Parameter_Type: Threshold
  Operator: <=
  Value: 20
  Value_2: null
  Unit: Miles
  Applies_To: Peer store
  Severity: High
  Active: 'Yes'
  Notes: Same format / region.
- KPI_ID: KPI015
  Signal_Name: Forecast vs Actual (%)
  RCA_Bucket: Demand Signal Problem
  Parameter_ID: P019
  Parameter_Name: Forecast bias
  Parameter_Type: Threshold
  Operator: '>'
  Value: 15
  Value_2: null
  Unit: '%'
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: 'Positive bias: forecast over-estimated demand by >15%.'
- KPI_ID: KPI016
  Signal_Name: Par Level Age (Days)
  RCA_Bucket: Supply Decision Problem
  Parameter_ID: P020
  Parameter_Name: Par level age
  Parameter_Type: Threshold
  Operator: '>'
  Value: 90
  Value_2: null
  Unit: Days
  Applies_To: Club S10
  Severity: High
  Active: 'Yes'
  Notes: Standing order/par level considered stale.
- KPI_ID: KPI017
  Signal_Name: Excess Supply Ratio
  RCA_Bucket: Supply Decision Problem
  Parameter_ID: P021
  Parameter_Name: Excess supply ratio
  Parameter_Type: Threshold
  Operator: '>'
  Value: 2
  Value_2: null
  Unit: Ratio
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: More than 2x supply needed already committed.
- KPI_ID: KPI018
  Signal_Name: Promo Excess Supply Ratio
  RCA_Bucket: Supply Decision Problem
  Parameter_ID: P022
  Parameter_Name: Promo excess supply ratio
  Parameter_Type: Threshold
  Operator: '>'
  Value: 3
  Value_2: null
  Unit: Ratio
  Applies_To: Promo
  Severity: High
  Active: 'Yes'
  Notes: Only when Days Since Promo Ended > 0.
- KPI_ID: KPI019
  Signal_Name: High Safety Stock Flag (Days)
  RCA_Bucket: Supply Decision Problem
  Parameter_ID: P023
  Parameter_Name: Safety stock excess
  Parameter_Type: Threshold
  Operator: '>'
  Value: 2
  Value_2: null
  Unit: Days
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: Current SS days exceed target SS days by >2.
- KPI_ID: KPI020
  Signal_Name: Supplier MOQ Ratio
  RCA_Bucket: Supply Decision Problem
  Parameter_ID: P024
  Parameter_Name: Supplier MOQ ratio
  Parameter_Type: Threshold
  Operator: '>'
  Value: 1.3
  Value_2: null
  Unit: Ratio
  Applies_To: SKU-Store
  Severity: High
  Active: 'Yes'
  Notes: MOQ forces >30% overbuy.
- KPI_ID: KPI021
  Signal_Name: Is Perishable Flag
  RCA_Bucket: Perishable — Context
  Parameter_ID: P025
  Parameter_Name: Perishable indicator
  Parameter_Type: Flag
  Operator: '='
  Value: 1
  Value_2: null
  Unit: Flag
  Applies_To: Perishable categories
  Severity: Override
  Active: 'Yes'
  Notes: Activates perishable decision path.
- KPI_ID: KPI022
  Signal_Name: Shelf Life Remaining (Days)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P026
  Parameter_Name: Emergency shelf life — Fresh/Chilled
  Parameter_Type: Threshold
  Operator: <=
  Value: 1
  Value_2: null
  Unit: Days
  Applies_To: Fresh / Chilled
  Severity: Emergency
  Active: 'Yes'
  Notes: 'Hard threshold: donate/dispose.'
- KPI_ID: KPI022
  Signal_Name: Shelf Life Remaining (Days)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P027
  Parameter_Name: Emergency shelf life — Bakery/Fish
  Parameter_Type: Threshold
  Operator: <=
  Value: 0.5
  Value_2: null
  Unit: Days
  Applies_To: Bakery / Fish
  Severity: Emergency
  Active: 'Yes'
  Notes: 'Hard threshold: donate/dispose.'
- KPI_ID: KPI023
  Signal_Name: Expiry Proximity Score (EPS)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P028
  Parameter_Name: EPS critical
  Parameter_Type: Threshold
  Operator: '>'
  Value: 1
  Value_2: null
  Unit: Ratio
  Applies_To: Perishable
  Severity: Critical
  Active: 'Yes'
  Notes: Will not clear before expiry at current velocity.
- KPI_ID: KPI023
  Signal_Name: Expiry Proximity Score (EPS)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P029
  Parameter_Name: EPS at-risk lower bound
  Parameter_Type: Threshold
  Operator: '>='
  Value: 0.75
  Value_2: null
  Unit: Ratio
  Applies_To: Perishable
  Severity: High
  Active: 'Yes'
  Notes: 0.75–1.0 is at risk.
- KPI_ID: KPI023
  Signal_Name: Expiry Proximity Score (EPS)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P030
  Parameter_Name: EPS safe upper bound
  Parameter_Type: Threshold
  Operator: <
  Value: 0.75
  Value_2: null
  Unit: Ratio
  Applies_To: Perishable
  Severity: Normal
  Active: 'Yes'
  Notes: Below 0.75 is considered safe.
- KPI_ID: KPI024
  Signal_Name: Markdown Window (Days)
  RCA_Bucket: Perishable — Expiry Risk
  Parameter_ID: P031
  Parameter_Name: Markdown window viability
  Parameter_Type: Threshold
  Operator: '>'
  Value: 0
  Value_2: null
  Unit: Days
  Applies_To: Perishable
  Severity: High
  Active: 'Yes'
  Notes: '>0 means markdown remains commercially viable; <=0 means donate/dispose only.'
Context_Parameters:
- Parameter_ID: CTX001
  Parameter_Name: Promo suppression multiplier
  Value: 3
  Unit: x Target
  Applies_To: Active Promo
  Active: 'Yes'
  Notes: Suppress excess signals unless Weeks Cover > 3x target.
- Parameter_ID: CTX002
  Parameter_Name: Upcoming promo window
  Value: 14
  Unit: Days
  Applies_To: Upcoming Promo
  Active: 'Yes'
  Notes: Promo starting within this window can suppress excess signals when stock is ordered.
- Parameter_ID: CTX003
  Parameter_Name: Peer search radius
  Value: 20
  Unit: Miles
  Applies_To: Peer comparison
  Active: 'Yes'
  Notes: Used by Peer Shortage Flag.
- Parameter_ID: CTX004
  Parameter_Name: Peer shortage weeks cover
  Value: 1.5
  Unit: Weeks
  Applies_To: Peer comparison
  Active: 'Yes'
  Notes: Peer considered short when WC is below this level.
- Parameter_ID: CTX005
  Parameter_Name: Post-promo velocity recovery threshold
  Value: 0.5
  Unit: Ratio
  Applies_To: Post-promo
  Active: 'Yes'
  Notes: Below this level indicates demand collapse.
- Parameter_ID: CTX006
  Parameter_Name: Post-promo elapsed days threshold
  Value: 7
  Unit: Days
  Applies_To: Post-promo
  Active: 'Yes'
  Notes: Club S7 rule from source file.
- Parameter_ID: CTX007
  Parameter_Name: Seasonal excess suppression multiplier
  Value: 3
  Unit: x Target
  Applies_To: Active Season
  Active: 'Yes'
  Notes: Suppress excess signals unless Weeks Cover > 3x target.
- Parameter_ID: CTX008
  Parameter_Name: Par level age threshold
  Value: 90
  Unit: Days
  Applies_To: Club S10
  Active: 'Yes'
  Notes: Source rule references Club S10.
Perishable_Parameters:
- Parameter_ID: PER001
  Category_Group: Fresh / Chilled
  Parameter_Name: Emergency shelf life
  Value: 1
  Unit: Day
  Action_Implication: Donate / Dispose
  Active: 'Yes'
  Notes: Hard threshold from source.
- Parameter_ID: PER002
  Category_Group: Bakery / Fish
  Parameter_Name: Emergency shelf life
  Value: 0.5
  Unit: Day
  Action_Implication: Donate / Dispose
  Active: 'Yes'
  Notes: Hard threshold from source.
- Parameter_ID: PER003
  Category_Group: All Perishable
  Parameter_Name: EPS critical threshold
  Value: 1
  Unit: Ratio
  Action_Implication: Expiry risk is critical; determines urgency/action
  Active: 'Yes'
  Notes: Stock will not clear before expiry at current velocity.
- Parameter_ID: PER004
  Category_Group: All Perishable
  Parameter_Name: EPS at-risk lower bound
  Value: 0.75
  Unit: Ratio
  Action_Implication: At risk
  Active: 'Yes'
  Notes: EPS 0.75–1.0.
- Parameter_ID: PER005
  Category_Group: All Perishable
  Parameter_Name: Markdown window viability
  Value: 0
  Unit: Days
  Action_Implication: '<=0: Donate / Dispose only; >0: Markdown viable'
  Active: 'Yes'
  Notes: Markdown Window = Shelf Life Remaining - Transfer Lead Time - Min Display Time.
- Parameter_ID: PER006
  Category_Group: All Perishable
  Parameter_Name: Min display time divisor
  Value: 3
  Unit: Category benchmark divisor
  Action_Implication: Used in Min Display Time calculation
  Active: 'Yes'
  Notes: Source says Min Display = Category Benchmark ÷ 3.
